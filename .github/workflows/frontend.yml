name: frontend

# Джоба фронта. Независима от бэкендовой: у частей монорепо свои зависимости
# и свои проверки, общее у них только REST-контракт.
#
# ВАЖНО: на момент добавления (2026-08-11) не проверено, собирается ли код
# Вовы вообще — Flutter SDK локально нет, и эта джоба и есть способ выяснить.
# Первые прогоны, скорее всего, красные: pubspec.lock собран под Dart 3.10,
# а сам код писался в 2023 году под Dart 2.17.
on:
  push:
    branches: [main, dev]
  pull_request:
  # Прогон по кнопке с любой ветки: рабочие ветки push-триггером не
  # покрыты, и без этого сборку APK приходилось заказывать через PR.
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter --version
        run: flutter --version

      - name: pub get
        run: flutter pub get

      # Диагностика, а не гейт: на 71 тысяче строк кода 2023 года анализатор
      # даст много замечаний, и падать из-за них на каждом пуше смысла нет.
      # Смотрим на цифру в логе и уменьшаем её по мере рефакторинга.
      - name: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Гейт: офлайн-логика механика — очередь исходящих действий и слияние
      # с локальной базой. Проверить её на объекте, где рвётся связь, нельзя,
      # а цена ошибки — потерянная работа человека.
      #
      # Именно `test/mechanic`, а не весь каталог: остальное — наследие
      # подрядчика, к зелёному оно не приведено, и гейт из него не сделать.
      - name: test (механик)
        run: flutter test test/mechanic

      # А вот это настоящий гейт: собирается или нет.
      - name: build web
        run: flutter build web --release

  # Сборка под Android вынесена в отдельную джобу: у неё свои требования
  # (JDK 17 под AGP 8, Android SDK) и своя причина падать — валить из-за неё
  # веб-гейт незачем.
  android:
    runs-on: ubuntu-latest
    # На уровне джобы, а не шага: в условии `if` виден именно контекст env
    # джобы, и проверка «секрет задан» иначе всегда была бы ложной.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # AGP 8 не поднимается ни на чём ниже 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      # Ключ подписи. Секретов может не быть (форк, PR извне) — тогда шаг
      # молча пропускается, а build.gradle подписывает сборку debug-ключом:
      # проверить, что код компилируется, это не мешает.
      #
      # Раздавать механикам можно только APK из прогона, где ключ был: у
      # debug-подписи на каждом раннере свой ключ, и обновление поверх такой
      # сборки не встанет.
      - name: unpack keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/els-release.jks
          cat > android/key.properties <<EOF
          storeFile=els-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # Каталог android/ достался от подрядчика в состоянии 2022 года, и это
      # единственная площадка, где сборку можно проверить — ни SDK, ни Java
      # на машине разработки нет.
      #
      # release, а не debug: это тот самый файл, который поедет механикам.
      #
      # API_ORIGIN обязателен: у телефона нет страницы, из origin которой веб
      # берёт адрес бэкенда, и без этого флага сборка уходит на запасной адрес
      # из api_config.dart.
      #
      # Версия уезжает внутрь сборки через `--dart-define`: экран «Приложение»
      # сравнивает её с той, что лежит на сервере, и только так понимает, что
      # вышло обновление. Плагин ради двух значений в pubspec добавлять не
      # стали — веб-сборка их просто не задаёт, и баннера обновления там нет.
      - name: build apk (release)
        run: |
          version=$(awk '/^version:/{print $2}' pubspec.yaml)
          flutter build apk --release \
            --dart-define=API_ORIGIN=https://els23.ru \
            --dart-define=APP_VERSION_NAME="${version%%+*}" \
            --dart-define=APP_VERSION_CODE="${version##*+}"

      # Подпись и размер печатаются в лог, потому что sha256 — единственный
      # способ убедиться, что на сервер легло ровно то, что собрал CI.
      - name: apk info
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$apk"
          sha256sum "$apk"
          if [ -f android/key.properties ]; then
            echo "подписан ключом релиза"
          else
            echo "::warning::ключа релиза не было — APK подписан debug-ключом, механикам не раздавать"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: els-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          # Артефакт нужен ровно до того, как файл окажется на сервере.
          retention-days: 14
          if-no-files-found: error
