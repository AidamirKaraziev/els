[pytest]

pythonpath = .

# Оба размещения рабочие: рядом с бэкендом и в корне монорепо.
# Отсутствующий файл pytest-dotenv молча пропускает.
env_files =
    .test.env
    ../.test.env

markers =
    integration: запрос к приложению/БД (медленнее unit)

filterwarnings =
    ignore::DeprecationWarning:passlib
