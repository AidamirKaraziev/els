plugins {
    id "com.android.application"
    id "kotlin-android"
    // Загружается через includeBuild в settings.gradle — заменяет
    // `apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"`.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    // Пакет, в котором лежит app/src/main/java/com/example/els/MainActivity.java.
    // Под AGP 8 объявляется здесь: атрибут `package` в манифесте больше не
    // читается. applicationId намеренно оставлен прежним — его смена означает
    // другое приложение на телефонах механиков.
    namespace "com.example.els"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // TODO: сменить плейсхолдер подрядчика на настоящий идентификатор.
        applicationId "com.example.els"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            // Подписи релиза пока нет: механикам собирается debug-APK.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
