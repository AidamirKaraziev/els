[project]
name = "lift-app"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "alembic==1.13.2",
    "anyio==4.4.0",
    "async-timeout==4.0.3",
    "bcrypt==4.0.1",
    "click==8.1.7",
    "dnspython==2.6.1",
    "ecdsa==0.19.0",
    "email_validator==2.2.0",
    "exceptiongroup==1.2.2",
    "fastapi==0.95.2",
    "greenlet==3.0.3",
    "h11==0.14.0",
    "idna==3.7",
    "importlib_metadata==8.2.0",
    "importlib_resources==6.4.0",
    "Mako==1.3.5",
    "MarkupSafe==2.1.5",
    "paginate==0.5.6",
    "paginate-sqlalchemy==0.3.1",
    "passlib==1.7.4",
    "psycopg2-binary==2.9.6",
    "pyasn1==0.6.0",
    "pydantic==1.10.10",
    "python-dotenv==1.0.0",
    "python-jose==3.3.0",
    "python-multipart==0.0.9",
    "redis==4.6.0",
    "reportlab==4.2.5",
    "rsa==4.9",
    "six==1.16.0",
    "sniffio==1.3.1",
    "SQLAlchemy==1.4.48",
    "starlette==0.27.0",
    "typing_extensions==4.12.2",
    "uvicorn==0.21.1",
    "zipp==3.19.2",
]

[dependency-groups]
dev = [
    "ruff==0.15.8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py38"
line-length = 88
src = ["src"]
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "alembic/versions",
    "__init__.py",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
]
ignore = [
    "E501",   # line length — форматтер
    "B008",   # Depends() в аргументах по умолчанию — норма для FastAPI
]

[tool.ruff.lint.per-file-ignores]
# Одинаковые имена хендлеров в разных @router — для FastAPI это нормально
"src/api/api_v1/endpoints/*.py" = ["F811"]
"src/errors.py" = ["F811"]
# Регистрация exception handlers после объявления app
"src/main.py" = ["E402", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
