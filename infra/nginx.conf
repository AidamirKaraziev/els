# Единая точка входа: и веб-приложение, и API отдаются с одного origin.
# Благодаря этому браузеру не нужен CORS, а фронту — знать адрес бэкенда:
# достаточно относительного `/api/v1`.
#
# Монтируется в контейнер frontend как /etc/nginx/conf.d/default.conf

server {
    listen 80;
    server_name _;

    # Фото и PDF бывают тяжёлыми (дефектные ведомости с фотографиями).
    client_max_body_size 50m;

    # Сжатие. Веб-сборка Flutter — это ~5 МБ `main.dart.js`; без gzip она
    # уходит по сети целиком, и на мобильном интернете открытие приложения
    # занимает десятки секунд. gzip сокращает её примерно вчетверо.
    #
    # Brotli сжал бы ещё лучше, но в образе nginx:alpine его модуля нет —
    # понадобится, соберём образ с ним отдельно.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    # Загруженные файлы: фото пользователей и объектов, сканы, PDF.
    #
    # Отдаём с диска, а не через uvicorn. Тот же том, что у бэкенда, только на
    # чтение. На сервере с одним ядром это существенно: каждая картинка через
    # приложение занимала бы единственный рабочий процесс, из-за чего лента с
    # аватарками подвешивала бы API целиком.
    #
    # Префикс длиннее, чем у `/api/v1/` ниже, поэтому nginx выбирает именно
    # этот блок — у префиксных location выигрывает самый длинный, порядок в
    # файле роли не играет.
    location /api/v1/static/ {
        alias /app/static/;
        access_log off;
        # Имя файла — uuid, содержимое по нему не меняется никогда: замена
        # аватарки создаёт новый файл и удаляет старый.
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # API — на бэкенд. Префикс сохраняем: приложение слушает /api/v1/...
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        # Именно $http_host, а не $host: у второго отрезан порт. Бэкенд
        # строит по этому заголовку ссылки на файлы, и без порта они ведут
        # на 80 вместо 8080.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Загрузка фото с телефона по мобильной сети бывает медленной.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Swagger и OpenAPI бэкенда — чтобы не пробрасывать отдельный порт.
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    # Оболочка приложения — без кэша.
    #
    # Веб-сборка Flutter регистрирует service worker, который держит копию
    # приложения у пользователя. Обновиться он может, только если браузер
    # заново скачал сам `flutter_service_worker.js` и `version.json`. Пока
    # nginx не говорит про кэш ничего, браузер решает сам — и после выката
    # человек видит прошлую сборку, пока не почистит кэш руками.
    #
    # Именно из-за этого «Топ поломок» продолжал показывать заглушку с
    # «УК "Престиж"» после того, как контейнер уже отдавал новый main.dart.js.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location = /flutter_service_worker.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location = /version.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    # Всё остальное — веб-сборка Flutter. Роутинг внутри приложения,
    # поэтому неизвестные пути отдаём index.html, а не 404.
    #
    # `no-cache` — это не «не кэшировать», а «спроси перед использованием».
    # Имена файлов у Flutter web без хеша (`main.dart.js` всегда так и
    # называется), поэтому вечный кэш дал бы ту же залипшую сборку. С ETag
    # неизменившийся файл стоит одного 304, а изменившийся приезжает сразу.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
