# Основной стек проекта. Запускать ИЗ КОРНЯ репозитория, через Makefile:
#   make up / make down / make logs
#
# Все пути внутри файла относительны корня монорепо, а не каталога `infra/`,
# поэтому нужен флаг `--project-directory .`:
#   docker compose --project-directory . -f infra/docker-compose.yml up -d
# Он же подсовывает compose корневой `.env` для подстановки ${...}.

services:
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      # В `.env` историческая путаница: приложение читает DB_PASS, шаблоны в
      # backend/envs/ — DB_PASSWORD. Берём то, что есть, чтобы контейнер не
      # поднимался с пустым паролем.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${DB_PASS}}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Наружу — только чтобы подключиться клиентом БД с хоста. Если 5432 занят
      # другим проектом, задайте DB_HOST_PORT в .env; приложение это не заметит,
      # внутри сети оно ходит на postgres:5432.
      - "${DB_HOST_PORT:-5432}:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      # Топологию сети задаёт compose, а не .env: внутри неё база всегда
      # postgres:5432. В .env лежат настройки для запуска с хоста
      # (DB_HOST=localhost), и если их не перебить, контейнер стучится в себя
      # самого и падает с "connection to localhost refused".
      # Блок environment в compose приоритетнее env_file — этого и добиваемся.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS:-${DB_PASSWORD}}
      DB_NAME: ${DB_NAME}
      UVICORN_RELOAD: ${UVICORN_RELOAD}
    depends_on:
      postgres:
        condition: service_healthy
    # Порт наружу не публикуем: браузер и телефон ходят через nginx фронта,
    # один origin на всё. Для отладки бэкенда в обход прокси раскомментируйте.
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"
    volumes:
      - static_data:/app/static
    env_file:
      - .env

  # Веб-сборка Flutter + nginx, он же единая точка входа в систему:
  # `/` — приложение, `/api/v1/` — проксируется на backend.
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # Пусто = веб определяет адрес API из origin страницы. Переопределять
        # нужно только если API вынесен на отдельный хост.
        API_ORIGIN: ${API_ORIGIN:-}
        MAP_TILE_URL: ${MAP_TILE_URL:-}
        OSM_USER_AGENT: ${OSM_USER_AGENT:-}
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "55907:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    env_file:
      - .env

volumes:
  postgres_data:
  pgadmin_data:
  static_data:
