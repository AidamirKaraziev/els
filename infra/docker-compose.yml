# Основной стек проекта. Запускать ИЗ КОРНЯ репозитория, через Makefile:
#   make up / make down / make logs
#
# Все пути внутри файла относительны корня монорепо, а не каталога `infra/`,
# поэтому нужен флаг `--project-directory .`:
#   docker compose --project-directory . -f infra/docker-compose.yml up -d
# Он же подсовывает compose корневой `.env` для подстановки ${...}.

services:
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      # В `.env` историческая путаница: приложение читает DB_PASS, шаблоны в
      # backend/envs/ — DB_PASSWORD. Берём то, что есть, чтобы контейнер не
      # поднимался с пустым паролем.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${DB_PASS}}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS:-${DB_PASSWORD}}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      UVICORN_RELOAD: ${UVICORN_RELOAD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - static_data:/app/static
    env_file:
      - .env

  # frontend: появится вместе с кодом фронта в каталоге `frontend/`.

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "55907:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    env_file:
      - .env

volumes:
  postgres_data:
  pgadmin_data:
  static_data:
