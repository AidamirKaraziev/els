# Проверка владения доменом для Let's Encrypt.
#
# Включается и в HTTP-, и в HTTPS-конфиг. Без неё certbot не выпустит
# сертификат и, что важнее, не продлит его через 90 дней — а продление
# происходит молча, по расписанию, и заметить поломку будет некому.
#
# certbot кладёт сюда файл со случайным именем, а сервер удостоверяющего
# центра забирает его по HTTP. Каталог общий с контейнером certbot через
# том `certbot_www`.
#
# `^~` — чтобы блок выигрывал у регулярных location: проверка должна
# проходить всегда, даже если рядом появится что-то похожее по маске.
# По этой же причине на HTTPS-конфиге путь не редиректится, а отдаётся.

location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    access_log off;
}
