# Обслуживание по HTTP, без шифрования.
#
# Это состояние по умолчанию: так работает локальная разработка и так же
# работает сервер, пока не выпущен сертификат.
#
# Переключение на HTTPS — переменная `NGINX_CONF=https.conf` в `.env`
# и `make prod-nginx`. Обратно точно так же, поэтому откат занимает минуту
# и не требует ни пересборки образа, ни правки конфигов.

server {
    listen 80;
    server_name _;

    include /etc/nginx/els/acme.conf;
    include /etc/nginx/els/app.conf;
}
