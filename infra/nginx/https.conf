# Обслуживание по HTTPS с сертификатом Let's Encrypt.
#
# Включается переменной `NGINX_CONF=https.conf` в `.env` на сервере, дальше
# `make prod-nginx`. Откат — вернуть `http.conf` и повторить команду.
#
# Требует уже выпущенного сертификата: nginx не стартует, если файла нет.
# Порядок такой: сначала `make cert-issue` на работающем HTTP, и только
# потом переключение.

# ---------------------------------------------------------------------------
# HTTP — только проверка сертификата и редирект.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Проверка владения доменом остаётся на HTTP и НЕ редиректится.
    # Let's Encrypt ходит именно сюда, в том числе при продлении раз в
    # три месяца. Если её увести на HTTPS, сертификат однажды просто
    # перестанет продлеваться.
    include /etc/nginx/els/acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — здесь живёт приложение.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Пути фиксированные: certbot складывает сертификаты по имени первого
    # домена в наборе. Оба имени — els23.ru и www.els23.ru — лежат в одном
    # сертификате, отдельного файла для www нет.
    ssl_certificate     /etc/letsencrypt/live/els23.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/els23.ru/privkey.pem;

    # TLS 1.0 и 1.1 не поддерживаются браузерами с 2020 года и считаются
    # небезопасными. Набор шифров оставляем на усмотрение nginx: у 1.3 он
    # фиксирован спецификацией, а ручные списки быстро устаревают.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS сознательно не включён.
    #
    # Этот заголовок велит браузеру не ходить на домен по HTTP вообще и
    # запоминает это на месяцы. Пока сертификат и автопродление не пожили
    # хотя бы один цикл, возможность откатиться на HTTP дороже.
    # Когда включим: add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/els/acme.conf;
    include /etc/nginx/els/app.conf;
}
